# İndirim Çarkı — Shopify uygulama yapılandırması
#
# `npm run config:link` komutu bu dosyayı Partner hesabınızdaki uygulamaya bağlar
# ve client_id satırını otomatik yazar. application_url / redirect_urls satırları
# `npm run dev` sırasında otomatik güncellenir.

name = "Indirim Carki"
handle = "indirim-carki"
application_url = "https://example.com"
embedded = true

[access_scopes]
# Yalnızca gerçekten kullanılan yetkiler istenir:
#   write_discounts -> kazananlara tek kullanımlık indirim kodu üretmek için
#   write_customers -> (isteğe bağlı özellik) e-posta izni veren katılımcıyı
#                      Shopify müşteri listesine eklemek için
scopes = "write_discounts,write_customers"

[auth]
redirect_urls = [
  "https://example.com/auth/callback",
  "https://example.com/auth/shopify/callback",
  "https://example.com/api/auth/callback"
]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Shopify App Store için ZORUNLU gizlilik (GDPR) webhook'ları
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[app_proxy]
url = "/proxy"
subpath = "indirim-carki"
prefix = "apps"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true
